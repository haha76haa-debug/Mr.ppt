[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pptx-native"
version = "0.2.1"
description = "Design system, layout library and verification toolkit for building editable PowerPoint decks"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "haha76haa-debug" }]
keywords = ["pptx", "powerpoint", "slides", "deck", "design-system", "python-pptx", "ooxml", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Office Suites",
]
dependencies = [
  "python-pptx>=0.6.23",
  "pillow>=9.0",
  "lxml>=4.9",
  "numpy>=1.21",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.urls]
Homepage = "https://github.com/haha76haa-debug/Mr.ppt"
Issues = "https://github.com/haha76haa-debug/Mr.ppt/issues"

[project.scripts]
pptx-native = "pptx_native.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pptx_native"]

